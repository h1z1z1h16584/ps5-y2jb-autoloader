name: Build Stable Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish/update (e.g. v1.0 or latest)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Must run right after checkout, before anything writes to the tree,
      # so GIT_DIRTY is empty and RELEASE_VERSION uses the short hash form.
      - name: Get version from Makefile
        id: version
        run: |
          VERSION=$(make print-version BUILD_TYPE=stable)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Install System Dependencies and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget unzip zip patchelf tcl python3
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config" >> $GITHUB_ENV

      - name: Install PS5 Payload SDK
        run: |
          curl -fsSL -o /tmp/sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q /tmp/sdk.zip -d /opt
          sudo chmod -R 755 /opt/ps5-payload-sdk
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Build USB Installer ELF
        run: |
          chmod +x ./build_usb_payload.sh
          ./build_usb_payload.sh

      - name: Download Third-Party Dependencies
        run: |
          chmod +x scripts/download_deps.sh
          bash scripts/download_deps.sh

      - name: Build y2jb_update.zip
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Prepare download0 directory
        run: |
          mkdir -p download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=
          unzip -q y2jb_update.zip -d download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=
          rm -f download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/update-info.txt

      - name: Create UFS2 download0.dat in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            set -e
            truncate -s 336789504 download0.dat
            MD=$(mdconfig -a -t vnode -f "$(pwd)/download0.dat")
            newfs -O 2 -b 32768 -f 4096 "/dev/$MD"
            mount "/dev/$MD" /mnt
            cp -R download0/* /mnt/
            chmod -R 777 /mnt/*
            chmod 444 "/mnt/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/splash.html"
            sync
            umount /mnt
            mdconfig -d -u "$MD"

      - name: Prepare Release Artifacts
        run: |
          set -e
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y zip
          mkdir -p build
          mv y2jb_update.zip build/y2jb_update.zip
          mv download0.dat build/download0.dat
          ( cd build && zip -9 download0.dat.zip download0.dat )
          ls -lh build/
          [ -f build/download0.dat ]     || { echo "ERROR: build/download0.dat missing"; exit 1; }
          [ -f build/download0.dat.zip ] || { echo "ERROR: build/download0.dat.zip missing"; exit 1; }
          [ -f build/y2jb_update.zip ]   || { echo "ERROR: build/y2jb_update.zip missing"; exit 1; }
          [ -f build/usb-y2jb-installer.elf ] || echo "WARN: build/usb-y2jb-installer.elf missing"
      - name: Determine Target Tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          overwrite_files: true
          body: |
            ## ${{ steps.version.outputs.version }}

            Automated stable build from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            ### Assets
            - `download0.dat` — raw UFS2 image (~321 MB). FTP to `/user/download/PPSA0165*/`.
            - `download0.dat.zip` — same image, zipped (~1–2 MB). **Extract before use.**
            - `y2jb_update.zip` — place on the root of a USB drive to update the autoloader.
            - `usb-y2jb-installer.elf` — standalone payload to install `download0.dat` from USB.

            ### Recent changes
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full history.
          files: |
            build/download0.dat
            build/download0.dat.zip
            build/y2jb_update.zip
            build/usb-y2jb-installer.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
